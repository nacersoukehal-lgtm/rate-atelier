name: Refresh market quotes
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-quotes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: node refresh-market-quotes.mjs
      - name: Publish verified quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-quotes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh market quotes"
          git pull --rebase
          git push
