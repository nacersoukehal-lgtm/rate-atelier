name: Publish Rate Atelier with quote snapshots
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rate-atelier-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static pages with latest available quotes
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -r _site/.github
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {pages,metalQuotes,fxQuotes,renderSnapshot} from './render-quote-snapshot.mjs';

          async function json(url) {
            const response = await fetch(url,{signal:AbortSignal.timeout(10000)});
            if (!response.ok) throw Error('HTTP ' + response.status + ' from ' + new URL(url).hostname);
            return response.json();
          }

          const [previous,metals,usd,ecbUSD,ecbEUR] = await Promise.allSettled([
            json('https://getrateatelier.com/published-quote-snapshot.json'),
            json('https://standardbullion.com/spot-prices.json').then(metalQuotes),
            json('https://api.frankfurter.dev/v2/rates?base=USD&quotes=AUD,DZD').then(fxQuotes),
            json('https://api.frankfurter.dev/v2/providers/ecb/rate/usd/eur').then(row => fxQuotes([{...row,source:'ECB via Frankfurter'}])),
            json('https://api.frankfurter.dev/v2/providers/ecb/rate/eur/usd').then(row => fxQuotes([{...row,source:'ECB via Frankfurter'}]))
          ]);
          const quotes = previous.status === 'fulfilled' ? {...previous.value} : {};
          for (const code of ['EUR','EURUSD']) {
            if (quotes[code]?.source !== 'ECB via Frankfurter') delete quotes[code];
          }
          for (const response of [metals,usd,ecbUSD,ecbEUR]) {
            if (response.status === 'rejected') {
              console.warn(String(response.reason));
              continue;
            }
            for (const [code,quote] of Object.entries(response.value)) {
              const time = Date.parse(quote.date);
              if (Number.isFinite(quote.value) && quote.value > 0 && Number.isFinite(time) &&
                  !(time < Date.parse(quotes[code]?.date))) quotes[code] = quote;
            }
          }
          for (const file of ['index.html',...Object.keys(pages)]) {
            const path = '_site/' + file;
            await writeFile(path,renderSnapshot(await readFile(path,'utf8'),file,quotes));
          }
          await writeFile('_site/published-quote-snapshot.json',JSON.stringify(quotes));
          const bullionTimes = ['XAU','XAG','XPT','XPD'].map(code => quotes[code]?.date ?? null);
          await writeFile('_site/snapshot-status.json',JSON.stringify({builtAt:new Date().toISOString(),bullionTimes}));
          JS
          node enrich-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
