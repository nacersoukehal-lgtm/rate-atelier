name: Publish Rate Atelier with quote snapshots
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: rate-atelier-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static pages with latest available quotes
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -r _site/.github
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {pages,metalQuotes,fxQuotes,renderSnapshot} from './render-quote-snapshot.mjs';

          async function json(url) {
            const response = await fetch(url,{signal:AbortSignal.timeout(10000)});
            if (!response.ok) throw Error('HTTP ' + response.status + ' from ' + new URL(url).hostname);
            return response.json();
          }

          const [previous,metals,usd,ecbUSD,ecbEUR] = await Promise.allSettled([
            json('https://getrateatelier.com/published-quote-snapshot.json'),
            json('https://standardbullion.com/spot-prices.json').then(metalQuotes),
            json('https://api.frankfurter.dev/v2/rates?base=USD&quotes=AUD,DZD').then(fxQuotes),
            json('https://api.frankfurter.dev/v2/providers/ecb/rate/usd/eur').then(row => fxQuotes([{...row,source:'ECB via Frankfurter'}])),
            json('https://api.frankfurter.dev/v2/providers/ecb/rate/eur/usd').then(row => fxQuotes([{...row,source:'ECB via Frankfurter'}]))
          ]);
          const quotes = previous.status === 'fulfilled' ? {...previous.value} : {};
          for (const code of ['EUR','EURUSD']) {
            if (quotes[code]?.source !== 'ECB via Frankfurter') delete quotes[code];
          }
          for (const response of [metals,usd,ecbUSD,ecbEUR]) {
            if (response.status === 'rejected') {
              console.warn(String(response.reason));
              continue;
            }
            for (const [code,quote] of Object.entries(response.value)) {
              const time = Date.parse(quote.date);
              if (Number.isFinite(quote.value) && quote.value > 0 && Number.isFinite(time) &&
                  !(time < Date.parse(quotes[code]?.date))) quotes[code] = quote;
            }
          }
          for (const file of ['index.html',...Object.keys(pages)]) {
            const path = '_site/' + file;
            await writeFile(path,renderSnapshot(await readFile(path,'utf8'),file,quotes));
          }
          await writeFile('_site/published-quote-snapshot.json',JSON.stringify(quotes));
          const bullionTimes = ['XAU','XAG','XPT','XPD'].map(code => quotes[code]?.date ?? null);
          await writeFile('_site/snapshot-status.json',JSON.stringify({builtAt:new Date().toISOString(),bullionTimes}));
          JS
          node enrich-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'
                },
                signal: AbortSignal.timeout(10000)
              });
              if (!response.ok) throw new Error('Artifact lookup returned HTTP ' + response.status);
              const data = await response.json();
              if (data.artifacts?.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
                console.log('Pages artifact is visible to the deployment API.');
                break;
              }
              throw new Error('Pages artifact is not visible yet');
            } catch (error) {
              if (attempt === 12) throw error;
              console.warn(`Artifact visibility check ${attempt}/12: ${error.message}; retrying.`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
      - name: Prepare official Pages deployment action
        uses: actions/checkout@v4
        with:
          repository: actions/deploy-pages
          ref: d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
          path: .pages-deploy-action
          persist-credentials: false
      - name: Add bounded artifact lookup retry
        run: |
          cat > .pages-deploy-action/retry.cjs <<'JS'
          "use strict";
          const {spawn} = require("node:child_process");
          const path = require("node:path");
          
          function isArtifactLookupFailure(result) {
            return result.code !== 0 && !result.error && !result.signal &&
              result.output.includes('No artifacts named "github-pages" were found for this workflow run.') &&
              !/Creating Pages deployment with payload:|Created deployment for/.test(result.output);
          }
          
          async function deployWithRetry({run,wait,write,delays=[10000,20000]}) {
            for (let attempt=0; attempt<=delays.length; attempt++) {
              const result = await run();
              const retry = attempt < delays.length && isArtifactLookupFailure(result);
              // A recovered lookup failure is a warning; exhausted or unrelated failures remain errors.
              write(retry ? result.output.replace(/^::error(?= |::)/gm,"::warning") : result.output);
              if (result.code === 0) return 0;
              if (!retry) return 1;
              write("::warning::Pages artifact lookup failed before deployment started. Retrying in " +
                delays[attempt]/1000 + " seconds (attempt " + (attempt+2) + " of " + (delays.length+1) + ").\n");
              await wait(delays[attempt]);
            }
            return 1;
          }
          
          if (require.main === module) {
            let child;
            let cancelled = false;
            for (const signal of ["SIGINT","SIGTERM"]) process.on(signal,() => {
              cancelled = true;
              child?.kill(signal);
            });
            const run = () => new Promise(resolve => {
              if (cancelled) return resolve({code:1,output:"Deployment cancelled.\n",signal:"SIGTERM"});
              let output = "";
              let spawnError;
              child = spawn(process.execPath,[path.join(__dirname,"dist/index.js")],{
                env:process.env,stdio:["ignore","pipe","pipe"]
              });
              child.stdout.on("data",chunk => { output += chunk; });
              child.stderr.on("data",chunk => { output += chunk; });
              child.on("error",error => { spawnError = error; });
              child.on("close",(code,signal) => {
                if (spawnError) output += "::error::Unable to start the official Pages deployment action.\n";
                resolve({code,signal,error:spawnError,output});
              });
            });
            deployWithRetry({
              run,
              wait:ms=>new Promise(resolve=>setTimeout(resolve,ms)),
              write:text=>process.stdout.write(text)
            }).then(code=>{process.exitCode=code;}).catch(error=>{
              console.error("::error::Pages retry wrapper failed: " + error.message);
              process.exitCode=1;
            });
          }
          module.exports={deployWithRetry,isArtifactLookupFailure};
          JS
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const file = '.pages-deploy-action/action.yml';
          const original = await readFile(file,'utf8');
          const entry = "main: 'dist/index.js'";
          if (original.split(entry).length !== 2) throw Error('Unexpected official action entry point');
          await writeFile(file,original.replace(entry,"main: 'retry.cjs'"));
          JS
      - name: Deploy Pages with targeted retry
        uses: ./.pages-deploy-action
        with:
          token: ${{ github.token }}
          timeout: '180000'


